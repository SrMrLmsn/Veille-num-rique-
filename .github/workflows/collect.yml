name: Collecte RSS quotidienne

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation des dépendances
        run: npm install --legacy-peer-deps


      - name: Collecte des flux RSS
        run: node collect.js

      - name: Commit et push si changements
        run: |
          git config user.name "veille-bot"
          git config user.email "bot@veille-juridique"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "chore: collecte RSS $(date +'%Y-%m-%d %H:%M')"
          git push
